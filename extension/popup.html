<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Save to Kornu</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main class="clipper">
      <header class="masthead">
        <img src="wordmark.svg" alt="Kornu" width="112" height="34">
        <span class="brand-mark" aria-hidden="true">✳</span>
      </header>

      <section class="clip-content" aria-labelledby="page-title">
        <div class="source-row"><p class="source-line"><span>FROM</span><strong class="page-host" id="page-host"></strong></p><span class="status-mark" id="status-mark" hidden aria-hidden="true"></span></div>
        <h1 id="page-title">Reading this tab…</h1>
        <p class="article-context" id="article-context" hidden></p>
        <button id="save" type="button" disabled>
          <span class="save-label">Save reading</span>
          <span class="save-symbol" aria-hidden="true">→</span>
        </button>
        <div class="capture-steps" id="capture-steps" hidden aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <p id="message" role="status" aria-live="polite"></p>
      </section>

      <details class="site-settings">
        <summary><span class="destination-label">Kornu library</span><span class="change-label">Settings</span></summary>
        <div class="site-settings-body">
          <label for="site-url">Kornu web address</label>
          <input id="site-url" type="url" spellcheck="false" placeholder="https://your-site.netlify.app/">
          <p id="site-hint" role="status" aria-live="polite">Choose where future saves open your library.</p>
        </div>
      </details>
    </main>
  </body>
</html>
